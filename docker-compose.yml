version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ipsakti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ipsakti
      POSTGRES_USER: ipsakti_user
      POSTGRES_PASSWORD: ipsakti_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti_user -d ipsakti"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # pgAdmin (optional – comment out if not needed)
  # ──────────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: ipsakti_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ipsakti.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
